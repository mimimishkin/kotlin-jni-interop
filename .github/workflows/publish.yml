name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# A release publishes every module to two repositories, and neither of them takes a second upload of a version that
# is already there. Overlapping runs would collide halfway through, so a new tag waits for the previous one.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest

    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # `jni-binding-annotations` is an Android library, so its publication builds an AAR and the Android Gradle Plugin
      # needs its compileSdk platform. The runner images do not ship API 37, so install it here instead of leaving it to
      # the plugin's automatic download.
      - name: Set up the Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish jni-binding-annotations
        run: ./gradlew :jni-binding-annotations:publishAllPublicationsToMavenCentralRepository --no-configuration-cache

      - name: Publish jni-binding-raw
        run: ./gradlew :jni-binding-raw:publishAllPublicationsToMavenCentralRepository --no-configuration-cache

      - name: Publish jni-binding
        run: ./gradlew :jni-binding:publishAllPublicationsToMavenCentralRepository --no-configuration-cache

      - name: Publish jawt-binding
        run: ./gradlew :jawt-binding:publishAllPublicationsToMavenCentralRepository --no-configuration-cache

      - name: Publish jni-binding-producer
        run: ./gradlew :jni-binding-producer:publishAllPublicationsToMavenCentralRepository --no-configuration-cache

      - name: Publish jni-binding-consumer
        run: ./gradlew :jni-binding-consumer:publishAllPublicationsToMavenCentralRepository --no-configuration-cache

      - name: Publish the Gradle plugins to the Gradle Plugin Portal
        run: ./gradlew :jni-binding-plugins:publishPlugins --no-configuration-cache
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}