name: Documentation

on:
  push:
    branches: [ 'master' ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: documentation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  documentation:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      # `jni-binding-annotations` is an Android library in the same build, so the Android Gradle Plugin validates its
      # compileSdk platform even though the documentation task never compiles a line of Android code.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0'
          log-accepted-android-licenses: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The version string Dokka's versioning plugin labels the output with and shows in the version dropdown: a tag
      # documents that released version, anything else is the moving `dev`.
      - name: Resolve the version
        id: version
        run: |
          version=dev
          [ "$GITHUB_REF_TYPE" = tag ] && version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Dokka's versioning plugin wants an archive that holds every previous version as its own Dokka output, one
      # directory per version. The published site is already that set - its root is the newest version and the versions
      # before it sit under `older/` - so it is simply fetched here; the `prepareDokkaArchive` Gradle task reshapes it
      # into the archive, before generation reads it.
      - name: Fetch the published site
        run: |
          mkdir -p published
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git archive FETCH_HEAD | tar -x -C published
          fi

      # `:dokkaGenerate`, with the project path, is the aggregating task: the root declares a `dokka(project(...))`
      # dependency on every subproject it documents, and Dokka merges them into a single site with one shared
      # navigation. The versioning plugin adds the dropdown and bundles the archive under `older/`.
      - name: Generate the documentation
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew :dokkaGenerate --no-configuration-cache \
            -PdocVersion="$VERSION" \
            -PpublishedDocsDir="$PWD/published"

      # The generated directory is self-contained - the current version plus every archive version under `older/` - so
      # the branch is replaced wholesale rather than merged with what its previous run left behind.
      - name: Publish the site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/dokka/html
          force_orphan: true