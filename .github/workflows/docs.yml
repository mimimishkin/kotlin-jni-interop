name: Documentation

on:
  push:
    branches: [ 'master' ]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  documentation:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      # `jni-binding-annotations` is an Android library in the same build, so the Android Gradle Plugin validates its
      # compileSdk platform even though the documentation task never compiles a line of Android code. The runner images
      # do not ship API 37, so install it here instead of leaving it to the plugin's automatic download.
      - name: Set up the Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # `:dokkaGenerate`, with the project path, is the aggregating task: the root declares a `dokka(project(...))`
      # dependency on every subproject it documents, and Dokka merges them into a single site with one shared
      # navigation. Without the path Gradle would run the task in every subproject on its own.
      - name: Generate the documentation
        run: ./gradlew :dokkaGenerate --no-configuration-cache

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the documentation as a Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Dokka writes the aggregated site here: one directory per documented subproject plus shared assets.
          path: build/dokka/html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5